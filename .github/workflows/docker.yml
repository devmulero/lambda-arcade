name: Build e publica imagem Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O ghcr.io exige nome em minúsculas (GB-Saraiva -> gb-saraiva)
      - name: Nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lambda-arcade" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache-from/cache-to: guarda as dependências compiladas entre execuções,
      # então só o primeiro build é demorado
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
